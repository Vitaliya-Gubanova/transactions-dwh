services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: dwh_kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: dwh_clickhouse
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-dwh}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-dwh}
      CLICKHOUSE_DB: raw
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  producer:
    build: ./producer
    container_name: dwh_producer
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: transactions
      EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-5}
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure

  consumer:
    build: ./consumer
    container_name: dwh_consumer
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: transactions
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-dwh}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-dwh}
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: on-failure

  # запускается отдельно: docker compose run --rm dbt
  dbt:
    build: ./dbt_project
    container_name: dwh_dbt
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-dwh}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-dwh}
    volumes:
      - ./dbt_project:/dbt
    depends_on:
      clickhouse:
        condition: service_healthy
    profiles: ["dbt"]

volumes:
  clickhouse_data:
