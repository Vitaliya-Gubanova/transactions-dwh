version: 2

models:
  - name: stg_transactions
    description: Очищенные транзакции без брака и дублей
    columns:
      - name: transaction_id
        data_tests:
          - not_null
          - unique
      - name: client_id
        data_tests:
          - not_null
      - name: category
        data_tests:
          - accepted_values:
              values: ["food", "transport", "entertainment", "health", "clothes"]
      - name: amount
        data_tests:
          - not_null
